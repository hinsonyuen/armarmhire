name: armarmhire

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: armarmhire_user
      POSTGRES_PASSWORD: armarmhire_pass
      POSTGRES_DB: armarmhire
    ports:
      - '5433:5432'
    volumes:
      - armarmhire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U armarmhire_user -d armarmhire']
      interval: 2s
      timeout: 5s
      retries: 20

  # Local test inbox for sign-up emails. Catches everything sent to
  # port 1025; read the emails at http://localhost:8025. Nothing is
  # delivered to real addresses.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  armarmhire_pgdata:
